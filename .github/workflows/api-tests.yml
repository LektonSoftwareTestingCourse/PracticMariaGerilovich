name: API contract tests

on:
  push:
    branches: ['**']
    paths:
      - 'services/api-tests/**'
      - 'services/**/src/main/**'
      - 'docker-compose.yaml'
      - '.github/workflows/api-tests.yml'
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Prepare environment
        run: cp .env.example .env
      - name: Build service images
        run: docker compose build
      - name: Start SMP stack
        run: docker compose up -d
      - name: Wait for Gateway
        run: |
          for i in {1..60}; do curl --fail --silent http://localhost:${GATEWAY_PORT:-8080}/health && exit 0; sleep 5; done
          docker compose ps
          exit 1
      - name: Run API tests
        run: mvn -f services/api-tests/pom.xml verify -Dapi.gateway.url=http://localhost:8080
      - name: Stop SMP stack
        if: always()
        run: docker compose down -v
